# TerraGIS Application Configuration

# Application metadata
app.name=TerraGIS
app.version=1.0-SNAPSHOT
app.title=TerraGIS - Professional Java GIS Platform

# Map canvas defaults
map.canvas.default.width=800
map.canvas.default.height=600
map.canvas.background.color=#F5F5F5

# Default CRS (Coordinate Reference System)
map.default.crs=EPSG:4326

# Geometry operations defaults
geometry.buffer.default.distance=100.0
geometry.buffer.default.unit=meters

# File dialog defaults
file.dialog.initial.directory=

# Performance settings
rendering.concurrent.enabled=true
rendering.max.features.before.simplify=10000

# Logging (complementary to logback.xml)
log.performance.warnings=true
log.geotools.verbose=false

# AI/ML Backend (future use)
ai.backend.url=
ai.backend.timeout=30000

# Persona mode defaults
persona.default=Surveyor (Cadastral)
persona.available=Surveyor (Cadastral),Hydrologist (Flood),Auditor (Carbon MRV)
