name: Dependency Security Scan

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - TerraGIS/pom.xml
      - TerraGIS/**
      - .github/workflows/**

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run OWASP Dependency-Check (transitive scan)
        working-directory: TerraGIS
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw -B -ntp org.owasp:dependency-check-maven:check \
            -Dformat=HTML \
            -Dformat=JSON \
            -DfailBuildOnCVSS=7 \
            -DnvdApiKey="$NVD_API_KEY"

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            TerraGIS/target/dependency-check-report.html
            TerraGIS/target/dependency-check-report.json
