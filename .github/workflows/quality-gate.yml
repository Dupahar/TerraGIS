name: Quality Gate

on:
  push:
    paths:
      - 'TerraGIS/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'TerraGIS/**'
      - '.github/workflows/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests
        working-directory: TerraGIS
        run: ./mvnw -B -ntp clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: TerraGIS/target/site/jacoco/
